services:
  php:
    build: .
    container_name: dynamicdb_php
    command: sleep infinity
    tty: true
    stdin_open: true
    volumes:
      - .:/app
    environment:
      - MYSQL_DB_HOST=db
      - MYSQL_DB_PORT=3306
      - MYSQL_DB_USER=root
      - MYSQL_DB_PASSWORD=root
      - MYSQL_DB_CHARSET=utf8mb4
      - MARIADB_DB_HOST=db_mariadb
      - MARIADB_DB_PORT=3306
      - MARIADB_DB_USER=root
      - MARIADB_DB_PASSWORD=root
      - MARIADB_DB_CHARSET=utf8mb4
      - PGSQL_DB_HOST=db_postgres
      - PGSQL_DB_PORT=5432
      - PGSQL_DB_USER=user
      - PGSQL_DB_PASSWORD=user
      - PGSQL_DB_CHARSET=utf8
      - PGSQL_DB_DATABASE=sample
    depends_on:
      - db
      - db_mariadb
      - db_postgres
    networks:
      - dynamicdb_network

  db:
    image: mysql:8.0
    container_name: dynamicdb_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dynamicdb_network

  db_mariadb:
    image: mariadb:11.7
    container_name: dynamicdb_mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - dynamicdb_network

  db_postgres:
    image: postgis/postgis:17-3.5
    container_name: dynamicdb_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: sample
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dynamicdb_network


volumes:
  mysql_data:
  mariadb_data:
  postgres_data:


networks:
  dynamicdb_network:
    driver: bridge
